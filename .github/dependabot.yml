version: 2
updates:
  # Keep GitHub Actions themselves up to date. Stack-agnostic; leave this in.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Gradle covers the version catalog (gradle/libs.versions.toml) and plugins.
  - package-ecosystem: gradle
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
