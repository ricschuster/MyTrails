name: CI

# PRs only. Branch protection requires branches to be up to date, so every PR
# is tested against current main before it merges; a run on push to main would
# test the same code again.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# repo-hygiene is stack-neutral. build is the Android job: lint and unit tests
# are added to it later so the required check name stays the same.
jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - name: Lint markdown
        run: npx --yes markdownlint-cli '**/*.md' --ignore node_modules --ignore LICENSE

      - name: No em dashes in tracked text
        run: |
          if git grep -In $'\xe2\x80\x94' -- . ':!LICENSE'; then
            echo "Em dash found. See CLAUDE.md: no em dashes in code, comments, docs, or commit messages." >&2
            exit 1
          fi

      - name: Docs structure present
        run: |
          test -f CLAUDE.md
          test -f docs/decisions/README.md
          test -f docs/handoffs/HANDOFF_TEMPLATE.md
          test -d docs/design

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A docs-only PR skips the Gradle steps. The job still runs and reports
      # success, so the required `build` check is satisfied.
      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change, skipping Gradle build."
          fi

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - if: steps.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Format, lint, unit tests, assemble
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew ktlintCheck lint test assembleDebug --stacktrace
